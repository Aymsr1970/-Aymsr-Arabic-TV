name: Update Arabic TV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    paths:
      - "build_playlist.py"
      - ".github/workflows/update-playlist.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist
        run: python build_playlist.py

      - name: Commit updated playlist
        run: |
          git config user.name "Arabic TV Playlist Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Ayman-Arabic-TV-v2.m3u
          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "Auto-update Arabic TV playlist"
            git push
          fi
